<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <title>Lux: what your laptop does before it wakes</title>
    <!-- The opening's picture and the text face are asked for at once, not after the script has run. -->
    <link rel="preload" as="image" type="image/webp" href="/src/assets/laptop-dark.webp" fetchpriority="high" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2"
      crossorigin
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta
      name="description"
      content="One recorded boot of open-source UEFI firmware in a virtual machine, followed from reset to the moment firmware hands the machine over. Every claim says where it comes from."
    />
    <!-- How a link to the site is previewed. The build adds the address of the picture: see vite.config.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lux" />
    <meta property="og:title" content="Lux: what your laptop does before it wakes" />
    <meta
      property="og:description"
      content="One recorded boot of open-source UEFI firmware in a virtual machine, followed from reset to the moment firmware hands the machine over. Every claim says where it comes from."
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Illustration: a laptop before power, dark, and the same laptop with its screen lit by a dawn sky."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* Black before the stylesheet arrives: the page never flashes white. */
      html {
        background: #000;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
